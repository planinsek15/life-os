# ntfy na strežniku "doma" — dosegljiv samo lokalno; navzven samo prek Tailscale (tailscale serve, HTTPS)
base-url: "https://doma.TVOJ-TAILNET.ts.net"
listen-http: ":80"
behind-proxy: true
cache-file: "/var/cache/ntfy/cache.db"
cache-duration: "72h"
attachment-cache-dir: "/var/cache/ntfy/attachments"
# iPhone: ntfy.sh dobi samo "ping" (zgoščen ID teme), vsebino telefon prebere s tega strežnika prek Tailscale
upstream-base-url: "https://ntfy.sh"
enable-signup: false
enable-login: false
web-root: "app"
