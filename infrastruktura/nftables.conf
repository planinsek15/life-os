#!/usr/sbin/nft -f
# Požarni zid strežnika "doma": privzeto vse dohodno prepovedano.
# Lastna tabela (brez "flush ruleset"), da ne pobriše pravil Dockerja.
destroy table inet doma

define DOM = 192.168.1.0/24
define TS4 = 100.64.0.0/10
define TS6 = fd7a:115c:a1e0::/48

table inet doma {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop
        iif "lo" accept

        # ping in nujni IPv6 (sosedje, usmerjevalnik)
        ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } limit rate 10/second accept
        meta l4proto ipv6-icmp accept

        # DHCP odgovori usmerjevalnika
        udp sport 67 udp dport 68 accept

        # SSH samo iz domačega omrežja in Tailscale
        tcp dport 22 ip saddr { $DOM, $TS4 } accept
        tcp dport 22 ip6 saddr { fe80::/10, $TS6 } accept
        iifname "tailscale0" tcp dport 22 accept

        # Tailscale (neposredna povezava WireGuard)
        udp dport 41641 accept

        # vse ostalo: zavrni
        counter
    }
    chain forward {
        type filter hook forward priority filter; policy accept;
    }
    chain output {
        type filter hook output priority filter; policy accept;
    }
}
